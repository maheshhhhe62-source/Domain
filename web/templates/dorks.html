<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dorks Generator — Spidey</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/dashboard" class="navbar-brand">
                <span class="navbar-logo">🕷️</span>
                <span class="navbar-title">SPIDEY</span>
            </a>
            <div class="navbar-links">
                <a href="/dashboard" class="navbar-link">🏠</a>
                <a href="/keywords" class="navbar-link">🥇</a>
                <a href="/dorks" class="navbar-link">🥈 Dorks</a>
                <a href="/parser" class="navbar-link">🛰️</a>
                <a href="/logout" class="navbar-link">🚪</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1 class="text-glow">🥈 Dorks Generator</h1>
        <p class="card-sub">Convert keywords → SQLi dorks (5 types)</p>

        {% if last %}
        <div class="alert alert-info" style="margin-top: 1rem;">
            📋 Last: <strong>{{ last.count }}</strong> {{ last.type }} dorks
            {% if last.file %} — <a href="/download/{{ last.file }}" style="color: var(--accent);">📥</a>{% endif %}
        </div>
        {% endif %}

        <div class="card" style="margin-top: 1.5rem;">
            <label>🎯 Dork Type</label>
            <select id="dorkType">
                <option value="normal">📌 Normal — Standard SQLi</option>
                <option value="hq">⭐ HQ — High quality</option>
                <option value="country">🌍 Country — Targeted</option>
                <option value="cms">🦨 CMS — WordPress/Joomla</option>
                <option value="exposed">🌫️ Exposed — .env/config</option>
            </select>
        </div>

        <div class="card" style="margin-top: 1.5rem;">
            <label>🔢 How Many Dorks?</label>
            <input type="number" id="count" value="5000" min="100" max="1000000">
        </div>

        <div class="card" style="margin-top: 1.5rem;">
            <label>🔑 Keywords</label>
            <p class="card-sub">Comma-separated or one per line</p>
            <textarea id="kwInput" placeholder="shop, payment, checkout, login, admin"></textarea>
            <div class="flex gap-2" style="margin-top: 1rem; flex-wrap: wrap;">
                <input type="file" id="fileInput" accept=".txt" onchange="loadFile(event)" style="display: none;">
                <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">📁 Upload</button>
                <button class="btn btn-secondary" onclick="document.getElementById('kwInput').value=''">🗑 Clear</button>
                <button class="btn btn-secondary" onclick="loadDefault()">✨ Default</button>
            </div>
        </div>

        <button class="btn btn-primary btn-block" style="margin-top: 1.5rem; padding: 1rem;" onclick="generateDorks()" id="genBtn">
            🚀 GENERATE DORKS
        </button>

        <div id="progressBox" class="card hidden" style="margin-top: 1.5rem;">
            <div class="flex justify-between items-center">
                <h3 id="progressTitle">⏳ Generating...</h3>
                <button id="stopBtn" class="btn btn-stop" onclick="stopScan()" style="display:none;">⛔ STOP</button>
            </div>
            <div class="progress-wrap">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <div class="progress-info">
                <span id="progressText">0/0</span>
                <span id="progressPct">0%</span>
            </div>
            <div id="logBox" class="log-box" style="margin-top: 1rem;"></div>
        </div>

        <div id="resultBox" class="card hidden" style="margin-top: 1.5rem;"></div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        let currentTaskId = null;
        let pollInterval = null;

        function toast(msg, type = 'info') {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 4000);
        }

        function loadFile(e) {
            const f = e.target.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = ev => { document.getElementById('kwInput').value = ev.target.result; };
            r.readAsText(f);
        }

        function loadDefault() {
            document.getElementById('kwInput').value = 'shop, payment, checkout, login, admin, cart';
        }

        async function generateDorks() {
            const kws = document.getElementById('kwInput').value.trim();
            if (!kws) { toast('Enter keywords!', 'error'); return; }

            document.getElementById('genBtn').disabled = true;
            document.getElementById('genBtn').textContent = '⏳ Working...';

            const fd = new FormData();
            fd.append('keywords', kws);
            fd.append('count', document.getElementById('count').value);
            fd.append('dork_type', document.getElementById('dorkType').value);

            try {
                const r = await fetch('/api/dorks/generate', { method: 'POST', body: fd });
                const d = await r.json();
                if (d.error) { toast(d.error, 'error'); reset(); return; }
                currentTaskId = d.task_id;
                document.getElementById('stopBtn').style.display = 'inline-flex';
                startPolling(d.task_id);
            } catch (e) {
                toast('Network error', 'error');
                reset();
            }
        }

        function reset() {
            document.getElementById('genBtn').disabled = false;
            document.getElementById('genBtn').textContent = '🚀 GENERATE DORKS';
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('stopBtn').textContent = '⛔ STOP';
        }

        async function stopScan() {
            if (!currentTaskId) return;
            if (!confirm('Rok du?')) return;
            try {
                await fetch(`/api/task/${currentTaskId}/cancel`, { method: 'POST' });
                document.getElementById('stopBtn').disabled = true;
                document.getElementById('stopBtn').textContent = '⛔ STOPPED';
                if (pollInterval) clearInterval(pollInterval);
                toast('Stopped', 'warning');
                reset();
            } catch (e) { toast('Failed', 'error'); }
        }

        function startPolling(tid) {
            const pb = document.getElementById('progressBox');
            pb.classList.remove('hidden');
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(async () => {
                try {
                    const r = await fetch(`/api/task/${tid}`);
                    const t = await r.json();
                    if (!t || !t.status) { clearInterval(pollInterval); return; }

                    const p = t.progress || {};
                    const done = p.done || 0, total = p.total || 0;
                    const pct = total ? Math.round(done * 100 / total) : 0;

                    document.getElementById('progressBar').style.width = pct + '%';
                    document.getElementById('progressText').textContent = `${done}/${total}`;
                    document.getElementById('progressPct').textContent = pct + '%';
                    if (p.msg) document.getElementById('progressTitle').textContent = '⏳ ' + p.msg;

                    const logBox = document.getElementById('logBox');
                    if (p.log && p.log.length) {
                        logBox.textContent = p.log.join('\n');
                        logBox.scrollTop = logBox.scrollHeight;
                    }

                    if (t.status === 'done') {
                        clearInterval(pollInterval);
                        const res = t.result || {};
                        document.getElementById('resultBox').classList.remove('hidden');
                        document.getElementById('resultBox').innerHTML = `
                            <h3 style="color: var(--success);">✅ Success!</h3>
                            <p>Generated: <strong>${res.count}</strong> ${res.type} dorks</p>
                            <div style="margin-top: 1rem;">
                                <a href="/download/${res.file}" class="btn btn-primary">📥 Download</a>
                                <a href="/parser" class="btn btn-secondary" style="margin-left: 0.5rem;">🛰️ Parser →</a>
                            </div>
                        `;
                        toast('Dorks generated!', 'success');
                        reset();
                    } else if (t.status === 'error' || t.status === 'cancelled') {
                        clearInterval(pollInterval);
                        toast('Task ' + t.status, t.status === 'cancelled' ? 'warning' : 'error');
                        reset();
                    }
                } catch (e) {}
            }, 1500);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const r = await fetch('/api/tasks/active');
                const d = await r.json();
                if (d.task_id) {
                    currentTaskId = d.task_id;
                    document.getElementById('stopBtn').style.display = 'inline-flex';
                    document.getElementById('genBtn').disabled = true;
                    startPolling(d.task_id);
                    toast('Resumed', 'info');
                }
            } catch (e) {}
        });
    </script>
</body>
</html>
