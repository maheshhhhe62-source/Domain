<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keywords Generator — Spidey</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/dashboard" class="navbar-brand">
                <span class="navbar-logo">🕷️</span>
                <span class="navbar-title">SPIDEY</span>
            </a>
            <div class="navbar-links">
                <a href="/dashboard" class="navbar-link">🏠</a>
                <a href="/keywords" class="navbar-link">🥇 Keywords</a>
                <a href="/dorks" class="navbar-link">🥈 Dorks</a>
                <a href="/logout" class="navbar-link">🚪</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1 class="text-glow">🥇 Keywords Generator</h1>
        <p class="card-sub">Enter seed brands/keywords — bot jaisa output</p>

        {% if last %}
        <div class="alert alert-info" style="margin-top: 1rem;">
            📋 Last run: <strong>{{ last.count }}</strong> keywords 
            {% if last.file %} — <a href="/download/{{ last.file }}" style="color: var(--accent);">📥 Download</a>{% endif %}
        </div>
        {% endif %}

        <div class="card" style="margin-top: 1.5rem;">
            <label>🔢 How Many Keywords?</label>
            <input type="number" id="count" value="1000" min="100" max="1000000">
        </div>

        <div class="card" style="margin-top: 1.5rem;">
            <label>📤 Enter Seeds</label>
            <p class="card-sub">Comma-separated or one per line</p>
            <textarea id="seedsInput" placeholder="shop, payment, login, admin, cart, order"></textarea>
            <div class="flex gap-2" style="margin-top: 1rem; flex-wrap: wrap;">
                <input type="file" id="fileInput" accept=".txt" onchange="loadFile(event)" style="display: none;">
                <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">📁 Upload</button>
                <button class="btn btn-secondary" onclick="document.getElementById('seedsInput').value=''">🗑 Clear</button>
                <button class="btn btn-secondary" onclick="loadDefault()">✨ Default</button>
            </div>
        </div>

        <button class="btn btn-primary btn-block" style="margin-top: 1.5rem; padding: 1rem;" onclick="generateKeywords()" id="genBtn">
            🚀 GENERATE KEYWORDS
        </button>

        <!-- Progress Box with STOP -->
        <div id="progressBox" class="card hidden" style="margin-top: 1.5rem;">
            <div class="flex justify-between items-center">
                <h3 id="progressTitle">⏳ Generating...</h3>
                <button id="stopBtn" class="btn btn-stop" onclick="stopScan()" style="display:none;">⛔ STOP</button>
            </div>
            <div class="progress-wrap">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <div class="progress-info">
                <span id="progressText">0/0</span>
                <span id="progressPct">0%</span>
            </div>
            <div id="logBox" class="log-box" style="margin-top: 1rem;"></div>
        </div>

        <div id="resultBox" class="card hidden" style="margin-top: 1.5rem;"></div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        let currentTaskId = null;
        let pollInterval = null;

        // ═══════════════════════════════════════
        // TOAST NOTIFICATIONS
        // ═══════════════════════════════════════
        function toast(msg, type = 'info') {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 4000);
        }

        // ═══════════════════════════════════════
        // FILE HANDLING
        // ═══════════════════════════════════════
        function loadFile(e) {
            const f = e.target.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = ev => { document.getElementById('seedsInput').value = ev.target.result; };
            r.readAsText(f);
        }

        function loadDefault() {
            document.getElementById('seedsInput').value = 
                'shop, payment, checkout, login, admin, cart, order, billing, account, credit';
        }

        // ═══════════════════════════════════════
        // GENERATE
        // ═══════════════════════════════════════
        async function generateKeywords() {
            const seeds = document.getElementById('seedsInput').value.trim();
            if (!seeds) { toast('Enter seeds first!', 'error'); return; }
            
            const count = document.getElementById('count').value;
            document.getElementById('genBtn').disabled = true;
            document.getElementById('genBtn').textContent = '⏳ Working...';

            const fd = new FormData();
            fd.append('seeds', seeds);
            fd.append('count', count);

            try {
                const r = await fetch('/api/keywords/generate', { method: 'POST', body: fd });
                const d = await r.json();
                if (d.error) { toast(d.error, 'error'); reset(); return; }
                
                currentTaskId = d.task_id;
                document.getElementById('stopBtn').style.display = 'inline-flex';
                startPolling(d.task_id);
            } catch (e) {
                toast('Network error', 'error');
                reset();
            }
        }

        function reset() {
            document.getElementById('genBtn').disabled = false;
            document.getElementById('genBtn').textContent = '🚀 GENERATE KEYWORDS';
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('stopBtn').textContent = '⛔ STOP';
        }

        // ═══════════════════════════════════════
        // STOP BUTTON
        // ═══════════════════════════════════════
        async function stopScan() {
            if (!currentTaskId) return;
            if (!confirm('Bhai, scan rokna hai?')) return;
            try {
                await fetch(`/api/task/${currentTaskId}/cancel`, { method: 'POST' });
                document.getElementById('stopBtn').disabled = true;
                document.getElementById('stopBtn').textContent = '⛔ STOPPED';
                if (pollInterval) clearInterval(pollInterval);
                toast('Scan stopped', 'warning');
                reset();
            } catch (e) {
                toast('Failed to stop', 'error');
            }
        }

        // ═══════════════════════════════════════
        // POLLING (setInterval instead of while)
        // ═══════════════════════════════════════
        function startPolling(tid) {
            const pb = document.getElementById('progressBox');
            pb.classList.remove('hidden');
            
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(async () => {
                try {
                    const r = await fetch(`/api/task/${tid}`);
                    const t = await r.json();
                    if (!t || !t.status) { clearInterval(pollInterval); return; }

                    const p = t.progress || {};
                    const done = p.done || 0, total = p.total || 0;
                    const pct = total ? Math.round(done * 100 / total) : 0;

                    document.getElementById('progressBar').style.width = pct + '%';
                    document.getElementById('progressText').textContent = `${done}/${total}`;
                    document.getElementById('progressPct').textContent = pct + '%';
                    if (p.msg) document.getElementById('progressTitle').textContent = '⏳ ' + p.msg;

                    const logBox = document.getElementById('logBox');
                    if (p.log && p.log.length) {
                        logBox.textContent = p.log.join('\n');
                        logBox.scrollTop = logBox.scrollHeight;
                    }

                    if (t.status === 'done') {
                        clearInterval(pollInterval);
                        const res = t.result || {};
                        const box = document.getElementById('resultBox');
                        box.classList.remove('hidden');
                        box.innerHTML = `
                            <h3 style="color: var(--success);">✅ Success!</h3>
                            <p style="margin-top: 0.5rem;">Generated: <strong>${res.count}</strong> keywords</p>
                            <div style="margin-top: 1rem;">
                                <a href="/download/${res.file}" class="btn btn-primary">📥 Download</a>
                                <a href="/dorks" class="btn btn-secondary" style="margin-left: 0.5rem;">🥈 Dorks →</a>
                            </div>
                        `;
                        toast('Keywords generated!', 'success');
                        reset();
                    } else if (t.status === 'error' || t.status === 'cancelled') {
                        clearInterval(pollInterval);
                        toast('Task ' + t.status, t.status === 'cancelled' ? 'warning' : 'error');
                        reset();
                    }
                } catch (e) {
                    console.error(e);
                }
            }, 1500);
        }

        // ═══════════════════════════════════════
        // AUTO-RESUME (refresh ke baad)
        // ═══════════════════════════════════════
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const r = await fetch('/api/tasks/active');
                const d = await r.json();
                if (d.task_id) {
                    currentTaskId = d.task_id;
                    document.getElementById('stopBtn').style.display = 'inline-flex';
                    document.getElementById('genBtn').disabled = true;
                    document.getElementById('genBtn').textContent = '⏳ Working...';
                    startPolling(d.task_id);
                    toast('Resumed active task', 'info');
                }
            } catch (e) {}
        });
    </script>
</body>
</html>
