<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Manager — Spidey</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/dashboard" class="navbar-brand">
                <span class="navbar-logo">🕷️</span>
                <span class="navbar-title">SPIDEY</span>
            </a>
            <div class="navbar-links">
                <a href="/dashboard" class="navbar-link">🏠</a>
                <a href="/proxy" class="navbar-link">🌊 Proxy</a>
                <a href="/logout" class="navbar-link">🚪</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1 class="text-glow">🌊 Proxy Manager</h1>
        <p class="card-sub">Add proxies manually or upload file. Check live status.</p>

        <div class="grid grid-2" style="margin-top: 1.5rem;">
            <div class="card">
                <h3>➕ Add Manual</h3>
                <p class="card-sub">Formats: ip:port, ip:port:user:pass, socks5://ip:port</p>
                <textarea id="manualInput" placeholder="1.2.3.4:8080&#10;5.6.7.8:3128:user:pass&#10;socks5://9.10.11.12:1080"></textarea>
                <div class="flex gap-2" style="margin-top: 1rem;">
                    <button class="btn btn-primary" onclick="addManual()">➕ Add</button>
                    <button class="btn btn-secondary" onclick="document.getElementById('manualInput').value=''">🗑 Clear</button>
                </div>
            </div>

            <div class="card">
                <h3>📁 Import File</h3>
                <p class="card-sub">.txt or .zip with proxies</p>
                <input type="file" id="fileInput" accept=".txt,.zip">
                <button class="btn btn-primary btn-block" style="margin-top: 1rem;" onclick="uploadFile()">📤 Upload</button>
            </div>
        </div>

        <div class="card" style="margin-top: 1.5rem;">
            <div class="flex justify-between items-center" style="flex-wrap: wrap; gap: 1rem;">
                <h3>📊 Total: <span id="proxyCount" style="color: var(--accent);">{{ count }}</span></h3>
                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                    <button class="btn btn-success" onclick="checkProxies()">✅ Check Live</button>
                    <button class="btn btn-danger" onclick="clearAll()">🗑 Clear All</button>
                    <button class="btn btn-secondary" onclick="loadList()">🔄 Refresh</button>
                </div>
            </div>
        </div>

        <div id="progressBox" class="card hidden" style="margin-top: 1.5rem;">
            <div class="flex justify-between items-center">
                <h3 id="progressTitle">⏳ Checking...</h3>
                <button id="stopBtn" class="btn btn-stop" onclick="stopScan()" style="display:none;">⛔ STOP</button>
            </div>
            <div class="progress-wrap">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <div class="progress-info">
                <span id="progressText">0/0</span>
                <span id="progressPct">0%</span>
            </div>
            <div id="logBox" class="log-box" style="margin-top: 1rem;"></div>
        </div>

        <div id="resultBox" class="card hidden" style="margin-top: 1.5rem;"></div>

        <div class="card" style="margin-top: 1.5rem;">
            <h3>📋 Proxy List</h3>
            <div id="proxyList" style="max-height: 400px; overflow-y: auto; margin-top: 1rem;">
                <p class="card-sub">Loading...</p>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        let currentTaskId = null;
        let pollInterval = null;

        function toast(msg, type = 'info') {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 4000);
        }

        async function addManual() {
            const text = document.getElementById('manualInput').value.trim();
            if (!text) { toast('Enter proxies!', 'error'); return; }
            const fd = new FormData();
            fd.append('proxies', text);
            const r = await fetch('/api/proxy/add', { method: 'POST', body: fd });
            const d = await r.json();
            if (d.error) { toast(d.error, 'error'); return; }
            toast(`Added ${d.added}, Total: ${d.total}`, 'success');
            document.getElementById('manualInput').value = '';
            loadList();
        }

        async function uploadFile() {
            const fi = document.getElementById('fileInput');
            if (!fi.files.length) { toast('Select file!', 'error'); return; }
            const fd = new FormData();
            fd.append('file', fi.files[0]);
            const r = await fetch('/api/proxy/import', { method: 'POST', body: fd });
            const d = await r.json();
            if (d.error) { toast(d.error, 'error'); return; }
            toast(`Imported ${d.added}, Total: ${d.total}`, 'success');
            fi.value = '';
            loadList();
        }

        async function checkProxies() {
            const r = await fetch('/api/proxy/check', { method: 'POST' });
            const d = await r.json();
            if (d.error) { toast(d.error, 'error'); return; }
            currentTaskId = d.task_id;
            document.getElementById('stopBtn').style.display = 'inline-flex';
            startPolling(d.task_id);
        }

        async function clearAll() {
            if (!confirm('Clear ALL proxies?')) return;
            await fetch('/api/proxy/clear', { method: 'POST' });
            toast('All cleared', 'success');
            loadList();
        }

        async function loadList() {
            const r = await fetch('/api/proxy/list');
            const d = await r.json();
            document.getElementById('proxyCount').textContent = d.count;
            const box = document.getElementById('proxyList');
            if (!d.proxies || !d.proxies.length) {
                box.innerHTML = '<p class="card-sub">No proxies saved yet.</p>';
                return;
            }
            let html = '';
            d.proxies.forEach((p, i) => {
                html += `<div style="padding: 0.5rem; border-bottom: 1px solid var(--border); font-family: monospace; font-size: 0.85rem;">
                    <span style="color: var(--text-muted);">${i+1}.</span> ${p}
                </div>`;
            });
            box.innerHTML = html;
        }

        function reset() {
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('stopBtn').textContent = '⛔ STOP';
        }

        async function stopScan() {
            if (!currentTaskId) return;
            if (!confirm('Rok du?')) return;
            await fetch(`/api/task/${currentTaskId}/cancel`, { method: 'POST' });
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('stopBtn').textContent = '⛔ STOPPED';
            if (pollInterval) clearInterval(pollInterval);
            toast('Stopped', 'warning');
            reset();
        }

        function startPolling(tid) {
            document.getElementById('progressBox').classList.remove('hidden');
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(async () => {
                try {
                    const r = await fetch(`/api/task/${tid}`);
                    const t = await r.json();
                    if (!t || !t.status) { clearInterval(pollInterval); return; }

                    const p = t.progress || {};
                    const done = p.done || 0, total = p.total || 0;
                    const pct = total ? Math.round(done * 100 / total) : 0;

                    document.getElementById('progressBar').style.width = pct + '%';
                    document.getElementById('progressText').textContent = `${done}/${total}`;
                    document.getElementById('progressPct').textContent = pct + '%';
                    if (p.msg) document.getElementById('progressTitle').textContent = '⏳ ' + p.msg;

                    if (t.status === 'done') {
                        clearInterval(pollInterval);
                        const res = t.result || {};
                        toast(`Live: ${res.live || 0}/${res.checked || 0}`, 'success');
                        document.getElementById('resultBox').classList.remove('hidden');
                        document.getElementById('resultBox').innerHTML = `<h3>✅ Checked ${res.checked} — Live: ${res.live}</h3>`;
                        loadList();
                        reset();
                    } else if (t.status === 'error' || t.status === 'cancelled') {
                        clearInterval(pollInterval);
                        toast('Task ' + t.status, t.status === 'cancelled' ? 'warning' : 'error');
                        reset();
                    }
                } catch (e) {}
            }, 1200);
        }

        loadList();

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const r = await fetch('/api/tasks/active');
                const d = await r.json();
                if (d.task_id) {
                    currentTaskId = d.task_id;
                    document.getElementById('stopBtn').style.display = 'inline-flex';
                    startPolling(d.task_id);
                    toast('Resumed proxy check', 'info');
                }
            } catch (e) {}
        });
    </script>
</body>
</html>
