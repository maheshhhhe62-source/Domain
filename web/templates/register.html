<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Spidey Dumper</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <div class="login-logo">🕷️</div>
            <h1 class="login-title text-glow">CREATE ACCOUNT</h1>
            <p class="login-sub">Enter license key to register</p>

            {% if error %}
            <div class="alert alert-error">❌ {{ error }}</div>
            {% endif %}

            {% if msg %}
            <div class="alert alert-info">ℹ️ {{ msg }}</div>
            {% endif %}

            <form method="POST" action="/register">
                <div class="form-group">
                    <label>🔑 License Key</label>
                    <input type="text" name="license_key" required
                           placeholder="XXXXX-XXXXX-XXXXX-XXXXX"
                           style="text-transform: uppercase; font-family: 'JetBrains Mono', monospace; letter-spacing: 1px;">
                </div>
                <div class="form-group">
                    <label>👤 Username</label>
                    <input type="text" name="username" required
                           placeholder="3-20 chars (letters, numbers, _)"
                           minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+">
                </div>
                <div class="form-group">
                    <label>🔐 Password</label>
                    <input type="password" name="password" required
                           placeholder="8+ chars (upper + lower + number)"
                           minlength="8">
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    🚀 CREATE ACCOUNT
                </button>
            </form>

            <p class="login-footer">
                Already have an account?
                <a href="/login" style="color: var(--accent);">Login →</a>
            </p>
            <p class="login-footer">
                Need a key? <a href="/plans" style="color: var(--accent);">View plans</a>
            </p>
        </div>
    </div>
</body>
</html>
