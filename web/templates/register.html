<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#03050a">
    <title>Register — Spidey</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <div class="login-logo">🕷️</div>
            <h1 class="login-title text-glow">CREATE ACCOUNT</h1>
            <p class="login-sub">Enter your license key to register</p>

            {% if error %}
            <div class="alert alert-error" style="margin-bottom: 1rem;">❌ {{ error }}</div>
            {% endif %}

            {% if msg %}
            <div class="alert alert-info" style="margin-bottom: 1rem;">ℹ️ {{ msg }}</div>
            {% endif %}

            <form method="POST" action="/register" autocomplete="off" novalidate>
                <div class="form-group">
                    <label>🔑 License Key</label>
                    <input type="text" name="license_key" required
                           placeholder="XXXXX-XXXXX-XXXXX-XXXXX"
                           maxlength="30"
                           autocomplete="off"
                           autocapitalize="characters"
                           autocorrect="off"
                           spellcheck="false"
                           inputmode="text"
                           style="text-transform: uppercase; font-family: 'JetBrains Mono', monospace; 
                                  letter-spacing: 2px; font-weight: 700; font-size: 16px;">
                </div>

                <div class="form-group">
                    <label>👤 Username</label>
                    <input type="text" name="username" required
                           placeholder="3-20 chars (a-z, 0-9, _)"
                           minlength="3" maxlength="20" 
                           pattern="[a-zA-Z0-9_]+"
                           autocomplete="off"
                           autocapitalize="none"
                           autocorrect="off"
                           spellcheck="false"
                           inputmode="text"
                           style="font-size: 16px;">
                </div>

                <div class="form-group">
                    <label>🔐 Password</label>
                    <input type="password" name="password" required
                           placeholder="8+ chars (A-Z, a-z, 0-9)"
                           minlength="8"
                           autocomplete="new-password"
                           autocapitalize="none"
                           autocorrect="off"
                           spellcheck="false"
                           inputmode="text"
                           style="font-size: 16px;">
                </div>

                <button type="submit" class="btn btn-primary btn-block" 
                        style="margin-top: 0.5rem; padding: 1rem; font-size: 1rem;">
                    🚀 CREATE ACCOUNT
                </button>
            </form>

            <div class="login-footer">
                Already have an account? 
                <a href="/login">Login →</a>
            </div>

            <div class="login-footer" style="margin-top: 0.75rem; font-size: 0.78rem;">
                <a href="/plans" style="color: var(--text-muted);">
                    💎 Need a license key? View plans
                </a>
            </div>
        </div>
    </div>
</body>
</html>
