<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLi Scanner — Spidey</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/dashboard" class="navbar-brand">
                <span class="navbar-logo">🕷️</span>
                <span class="navbar-title">SPIDEY</span>
            </a>
            <div class="navbar-links">
                <a href="/dashboard" class="navbar-link">🏠</a>
                <a href="/sqli" class="navbar-link active">🦠 SQLi</a>
                <a href="/dump" class="navbar-link">🕳️ Dump</a>
                <a href="/logout" class="navbar-link">🚪</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1 class="text-glow">🦠 SQLi Scanner</h1>
        <p class="card-sub">Test URLs for SQL injection vulnerabilities</p>

        {% if last %}
        <div class="alert alert-info" style="margin-top: 1rem;">
            📋 Last: <strong>{{ last.tested }}</strong> tested, <strong>{{ last.vuln }}</strong> vulnerable
            {% if last.file %} — <a href="/download/{{ last.file }}" style="color: var(--accent);">📥</a>{% endif %}
        </div>
        {% endif %}

        <div class="card" style="margin-top: 1.5rem;">
            <label>💉 Paste URLs (one per line)</label>
            <textarea id="urlsInput" style="min-height: 220px;" placeholder="http://example.com/page.php?id=1&#10;http://test.com/view.php?cat=2"></textarea>
            <div class="flex gap-2" style="margin-top: 1rem; flex-wrap: wrap;">
                <input type="file" id="fileInput" accept=".txt" onchange="loadFile(event)" style="display: none;">
                <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">📁 Upload</button>
                <button class="btn btn-secondary" onclick="document.getElementById('urlsInput').value=''">🗑 Clear</button>
            </div>
        </div>

        <button class="btn btn-primary btn-block" style="margin-top: 1.5rem; padding: 1rem;" onclick="runScan()" id="genBtn">
            🚀 START SCAN
        </button>

        <div id="progressBox" class="card hidden" style="margin-top: 1.5rem;">
            <div class="flex justify-between items-center">
                <h3 id="progressTitle">⏳ Scanning...</h3>
                <button id="stopBtn" class="btn btn-stop" onclick="stopScan()" style="display:none;">⛔ STOP</button>
            </div>
            <div class="progress-wrap">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <div class="progress-info">
                <span id="progressText">0/0</span>
                <span id="progressPct">0%</span>
            </div>
            <div class="flex gap-4" style="margin-top: 1rem;">
                <div class="stat-card" style="flex:1;">
                    <div class="stat-icon">🧪</div>
                    <div class="stat-value" id="testedCount">0</div>
                    <div class="stat-label">Tested</div>
                </div>
                <div class="stat-card" style="flex:1;">
                    <div class="stat-icon">🎯</div>
                    <div class="stat-value" id="vulnCount" style="color: var(--error);">0</div>
                    <div class="stat-label">Vulnerable</div>
                </div>
            </div>
            <div id="logBox" class="log-box" style="margin-top: 1rem;"></div>
        </div>

        <div id="resultBox" class="card hidden" style="margin-top: 1.5rem;"></div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        let currentTaskId = null;
        let pollInterval = null;

        function toast(msg, type = 'info') {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(() => {
                t.style.opacity = '0';
                setTimeout(() => t.remove(), 300);
            }, 4000);
        }

        function loadFile(e) {
            const f = e.target.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = ev => { document.getElementById('urlsInput').value = ev.target.result; };
            r.readAsText(f);
        }

        async function runScan() {
            const urls = document.getElementById('urlsInput').value.trim();
            if (!urls) { toast('Paste URLs!', 'error'); return; }
            
            document.getElementById('genBtn').disabled = true;
            document.getElementById('genBtn').textContent = '⏳ Scanning...';
            document.getElementById('progressBox').classList.remove('hidden');
            document.getElementById('stopBtn').style.display = 'inline-flex';
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('stopBtn').textContent = '⛔ STOP';
            document.getElementById('stopBtn').className = 'btn btn-stop';

            const fd = new FormData();
            fd.append('urls', urls);

            try {
                const r = await fetch('/api/sqli/scan', { method: 'POST', body: fd });
                const d = await r.json();
                if (d.error) { 
                    toast(d.error, 'error'); 
                    reset(); 
                    return; 
                }
                currentTaskId = d.task_id;
                toast('Scan started: ' + d.total + ' URLs', 'info');
                startPolling(d.task_id);
            } catch (e) { 
                toast('Network error', 'error'); 
                reset(); 
            }
        }

        function reset() {
            document.getElementById('genBtn').disabled = false;
            document.getElementById('genBtn').textContent = '🚀 START SCAN';
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('stopBtn').textContent = '⛔ STOP';
        }

        async function stopScan() {
            if (!currentTaskId) return;
            if (!confirm('Scan rok du?')) return;
            try {
                await fetch(`/api/task/${currentTaskId}/cancel`, { method: 'POST' });
                document.getElementById('stopBtn').disabled = true;
                document.getElementById('stopBtn').textContent = '⛔ STOPPED';
                if (pollInterval) clearInterval(pollInterval);
                toast('Stopped', 'warning');
                reset();
            } catch (e) { toast('Failed', 'error'); }
        }

        function startPolling(tid) {
            if (pollInterval) clearInterval(pollInterval);
            
            pollInterval = setInterval(async () => {
                try {
                    const r = await fetch(`/api/task/${tid}`);
                    if (!r.ok) return;
                    const t = await r.json();
                    if (!t || !t.status) { clearInterval(pollInterval); return; }

                    const p = t.progress || {};
                    const done = p.done || 0;
                    const total = p.total || 0;
                    const found = p.found || 0;
                    const pct = total ? Math.round(done * 100 / total) : 0;

                    document.getElementById('progressBar').style.width = pct + '%';
                    document.getElementById('progressText').textContent = `${done}/${total}`;
                    document.getElementById('progressPct').textContent = pct + '%';
                    document.getElementById('testedCount').textContent = done;
                    document.getElementById('vulnCount').textContent = found;
                    if (p.msg) document.getElementById('progressTitle').textContent = '⏳ ' + p.msg;

                    const logBox = document.getElementById('logBox');
                    if (p.log && p.log.length) {
                        logBox.textContent = p.log.join('\n');
                        logBox.scrollTop = logBox.scrollHeight;
                    }

                    if (t.status === 'done') {
                        clearInterval(pollInterval);
                        const res = t.result || {};
                        const box = document.getElementById('resultBox');
                        box.classList.remove('hidden');
                        box.innerHTML = `
                            <h3 style="color: var(--success);">✅ Scan Done!</h3>
                            <p style="margin-top:0.5rem;">Tested: <strong>${res.tested}</strong> | Vulnerable: <strong style="color: var(--error);">${res.vuln}</strong></p>
                            <div style="margin-top: 1rem;">
                                <a href="/download/${res.file}" class="btn btn-primary">📥 Download</a>
                                <a href="/dump" class="btn btn-success" style="margin-left: 0.5rem;">🕳️ Dump →</a>
                            </div>
                        `;
                        toast('Scan complete!', 'success');
                        reset();
                    } else if (t.status === 'error') {
                        clearInterval(pollInterval);
                        toast('Error: ' + (t.error || 'unknown'), 'error');
                        reset();
                    } else if (t.status === 'cancelled') {
                        clearInterval(pollInterval);
                        toast('Cancelled', 'warning');
                        reset();
                    }
                } catch (e) {
                    console.error('Poll error:', e);
                }
            }, 1500);
        }

        // Auto-resume agar page refresh hua
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const r = await fetch('/api/tasks/active');
                const d = await r.json();
                if (d.task_id) {
                    currentTaskId = d.task_id;
                    document.getElementById('genBtn').disabled = true;
                    document.getElementById('genBtn').textContent = '⏳ Scanning...';
                    document.getElementById('progressBox').classList.remove('hidden');
                    document.getElementById('stopBtn').style.display = 'inline-flex';
                    startPolling(d.task_id);
                    toast('Resumed active scan', 'info');
                }
            } catch (e) {}
        });
    </script>
</body>
</html>
